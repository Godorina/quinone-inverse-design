<script>
const D = {"src": {"Makefile": "# Run everything from this folder. onto/ is the working copy of the pipeline (copied from ../ontology/quinone on 2026-10-30).\nPY := $(CURDIR)/.venv/bin/python\n# GPU1 is mostly taken by llama-server; gpu4pyscf fails when it spreads onto it.\nexport CUDA_VISIBLE_DEVICES ?= 0\nB4 := onto/phase_4b_extend\n\n.PHONY: env dft-check test bench refset generate status pairs compounds review\nenv:       ## create .venv here from requirements.txt (python 3.11)\n\tuv venv --python 3.11 .venv && uv pip install --python .venv/bin/python -r requirements.txt\n\ndft-check: ## CPU vs GPU DFT on water must agree\n\t$(PY) dft_check.py\n\ntest:      ## all test suites\n\tcd onto/phase_2_schema && $(PY) tests/test_onto.py\n\tcd onto/phase_4_extract && uv run --frozen pytest -q\n\tcd $(B4) && $(PY) tests/test_4b.py && $(PY) tests/test_compound_review.py\n\tcd onto/phase_8_design && $(PY) tests/test_loop.py && $(PY) tests/test_expand.py\n\tcd onto/phase_8_design && $(PY) tests/test_generate.py && $(PY) tests/test_o2_sign.py && $(PY) tests/test_loop_contract.py && $(PY) tests/test_random_parents.py\n\tcd onto/phase_8_design && $(PY) tests/test_closed_loop.py && $(PY) tests/test_loop2.py && $(PY) tests/test_pubchem.py\n\tcd onto/phase_5_build && $(PY) tests/test_build.py && $(PY) tests/test_pubchem_build.py\n\tcd dft && $(PY) tests/test_dft.py\n\tcd dft && $(PY) tests/test_expand.py && $(PY) tests/test_run_set.py && $(PY) tests/test_summarize_foreign_json.py && $(PY) tests/test_highlevel_flags.py && $(PY) tests/test_highlevel_failed_jobs.py && $(PY) tests/test_highlevel_v2.py\n\tcd dft && $(PY) tests/test_highlevel.py\n\nbench:      ## run the BQ DFT benchmark\n\t$(PY) dft/bench.py\n\nrefset:     ## run the phase-7 DFT reference set on GPUs 0 and 1\n\t$(PY) dft/run_set.py --gpus 0,1\n\ngenerate:   ## generate phase-8 candidates with Claude\n\t$(PY) onto/phase_8_design/generate.py --calls 4\n\nloop:       ## run the phase-8 closed loop\n\t$(PY) onto/phase_8_design/closed_loop.py --rounds 3 --per-round 5\n\nstatus:    ## rebuild the 38-paper status table (uses cached abstracts)\n\t$(PY) $(B4)/xlsx_status.py\n\npairs:     ## rebuild the MeCN pair candidates (keeps no reviewer edits: back up pair_review.csv first)\n\t$(PY) $(B4)/pair_candidates.py\n\ncompounds: ## rebuild compound_review.csv (one row per compound; refuses to overwrite reviewer verdicts)\n\t$(PY) $(B4)/compound_review.py\n\nreview:    ## compound review progress toward the phase 7 gate (>=10 ok from >=2 papers)\n\t@python3 -c \"import csv,collections as C;r=list(csv.DictReader(open('$(B4)/compound_review.csv')));v=C.Counter(x['verdict'] or '-' for x in r);ok={x['paper_id'] for x in r if x['verdict']=='ok'};print(f'compounds {len(r)}  verdicts {dict(v)}  ok papers {len(ok)}  gate', 'PASS' if v['ok']>=10 and len(ok)>=2 else 'not yet')\"\n\nloop2:\n\t$(PY) onto/phase_8_design/closed_loop.py --rounds 3 --per-round 5 --arm llm --extra-ref onto/phase_8_design/runs/loop-20261031-151304\n\nloop2-random:\n\t$(PY) onto/phase_8_design/closed_loop.py --rounds 3 --per-round 5 --arm random --extra-ref onto/phase_8_design/runs/loop-20261031-151304\n\nhighlevel: ## composite final-candidate calculations on GPUs 0 and 1\n\t$(PY) dft/highlevel.py --gpus 0,1\n\nhighlevel2: ## high-level check of the v2 (expanded-search) candidates\n\t$(PY) dft/highlevel.py --gpus 0,1 --set v2\n\nrefset-expand: ## append expanded references and refit the combined line\n\t$(PY) dft/run_set.py --input onto/phase_4b_extend/reference_expansion.csv --out dft/runs/ref_set --gpus 0,1\n\nloop3: ## v2 closed loop\n\t$(PY) onto/phase_8_design/closed_loop.py --rounds 3 --per-round 5 --domain v2 --arm llm\n\nloop3-random: ## v2 random comparison\n\t$(PY) onto/phase_8_design/closed_loop.py --rounds 3 --per-round 5 --domain v2 --arm random\n", "closed_loop.py": "\"\"\"Three-round hypothesis generation and evaluation, with resumable round artifacts.\"\"\"\nimport os\nimport argparse\nimport csv\nimport json\nimport random\nimport subprocess\nimport sys\nfrom collections import Counter\nfrom datetime import datetime\nfrom pathlib import Path\n\nfrom generate import SUBSTITUENTS, _inchikey, call_llm, check, context, prompt, sa_score\nfrom loop import edit\nfrom pubchem import lookup as pubchem_lookup\n\n\ndef o2_feasible(rows):\n    \"\"\"Parents for the random arm: O2 margin >= 0.15 V and CO2 attached (reference rows say o2_margin_V, loop rows say margin).\"\"\"\n    return [x for x in rows if x.get('margin', x.get('o2_margin_V')) >= .15 and not x['co2_detached']]\n\ndef score(row, line):\n    f = (line['a'] * row['E2_eV'] + line['b'] - row['dE_bind_kcal']) / line['sigma']\n    margin = row['E_O2_eV'] - row['E2_eV']\n    return {**row, 'f': f, 'margin': margin, 'success': f >= 2 and margin >= .15 and not row['co2_detached']}\n\n\ndef loop_prompt(ctx, history, per_round=5):\n    previous = [p['smiles'] for r in history for p in r['accepted']]\n    evidence = prompt(ctx, previous).split('DFT evidence:\\n', 1)[1]\n    feedback = [{'results': r['results'], 'rejected': r['rejected']} for r in history]\n    rules = (\"Use reference parents; add, replace, remove or move only F, Cl, Br, NH2, OH. \" if ctx.get(\"domain\", \"v2\") == \"v1\" else \"Use reference parents and neutral quinones with a ring 1,2- or 1,4-carbonyl pair, C/H/N/O/F/Cl/Br/S only and at most 30 heavy atoms. \")\n    return (f'Propose exactly {per_round} testable hypotheses to exceed the tradeoff line: f >= 2, O2 margin >= 0.15 V, and no CO2 detachment. DFT will decide; proof of success is not required. '\n            'Cite D/K evidence supporting the direction. Return insufficient_evidence only when no evidence can be cited. '\n            f\"{rules}\"\n            'Return JSON proposals with parent_id, smiles, edits, cited_ids, hypothesis. '\n            'Promote directions that increased f, avoid those that decreased f, and explain why in hypothesis. '\n            f'Do not repeat SMILES: {json.dumps(previous)}\\nHistory: {json.dumps(feedback)}\\nDFT evidence:\\n{evidence}')\n\n\ndef add_extra_refs(ctx, directories):\n    ctx['extra_seen'] = set()\n    for directory in directories:\n        for path in sorted(directory.glob('round_*/*.json')):\n            data = json.loads(path.read_text())\n            states, adducts = data.get('states', {}), data.get('adducts', {})\n            required = [states.get(k, {}) for k in ('Q', 'Q_radical_anion', 'Q_dianion')]\n            if not isinstance(adducts, dict) or not adducts:\n                continue\n            calculations = required + list(adducts.values())\n            if not all(isinstance(x, dict) and x.get('converged') is True and x.get('geom_converged') is True for x in calculations):\n                continue\n            smiles = data.get('smiles')\n            key = _inchikey(smiles) if isinstance(smiles, str) else None\n            if key:\n                ctx['ref_fps'].append(smiles)\n                ctx['extra_seen'].add(key)\n\n\ndef compare_runs(dir_a, dir_b):\n    def read(directory):\n        path = Path(directory)\n        rows = [json.loads(line) for line in (path / 'ledger.jsonl').read_text().splitlines() if line.strip()]\n        return rows, rows[0].get('arm', 'llm') if rows else 'unknown'\n    a, arm_a = read(dir_a)\n    b, arm_b = read(dir_b)\n    def maximum(rows, number, oxygen=False):\n        results = next((r['results'] for r in rows if r['round'] == number), [])\n        values = [x['f'] for x in results if not oxygen or x['margin'] >= .15]\n        return f'{max(values):.3f}' if values else 'N/A'\n    lines = [f'| round | {arm_a} max f | {arm_a} O2 max f | {arm_b} max f | {arm_b} O2 max f |', '|---|---:|---:|---:|---:|']\n    for number in sorted({r['round'] for r in a + b}):\n        lines.append(f'| {number} | {maximum(a, number)} | {maximum(a, number, True)} | {maximum(b, number)} | {maximum(b, number, True)} |')\n    return '\\n'.join(lines) + '\\n'\n\n\ndef evaluate(path):\n    root = Path(__file__).resolve().parents[2]\n    subprocess.run([sys.executable, str(root / 'dft/run_set.py'), '--input', str(path / 'input.csv'), '--out', str(path), '--gpus', os.environ.get('LOOP_GPUS', '0,1')], check=True)  # LOOP_GPUS=0 when another job holds GPU1\n    return json.loads((path / 'summary.json').read_text())\n\n\ndef report(out, history, ctx, arm):\n    failures = Counter()\n    lines = ['# Closed loop', '', f'Arm: {arm}', '', '| round | max f | O2-pass max f | mean f | successes | proposals |', '|---|---:|---:|---:|---:|---:|']\n    for r in history:\n        values = [x['f'] for x in r['results']]\n        oxygen = [x['f'] for x in r['results'] if x['margin'] >= .15]\n        lines.append(f\"| {r['round']} | {max(values) if values else 'N/A'} | {max(oxygen) if oxygen else 'N/A'} | {sum(values)/len(values) if values else 'N/A'} | {sum(x['success'] for x in r['results'])} | {len(r['accepted']) + len(r['rejected'])} |\")\n        failures.update(x['reason'] for x in r['rejected'])\n    evaluated = [x for r in history for x in r['results']]\n    found = sum(x.get('pubchem_status') == 'found' for x in evaluated)\n    unknown = sum(x.get('pubchem_status') not in ('found', 'not_found') for x in evaluated)\n    lines += ['', f'평가 후보 중 PubChem 등록 {found}/{len(evaluated)} (조회 오류 또는 미조회 {unknown})', f\"Reference best f: {max(r['f'] for r in ctx['dft']):.2f} (all), {max((r['f'] for r in o2_feasible(ctx['dft'])), default=float('nan')):.2f} (O2-feasible; compare with the O2-pass column)\", f\"Proposals attempted: {sum(len(r['accepted']) + len(r['rejected']) for r in history)}\", f'Rejection counts: {dict(failures)}', f\"Total LLM cost USD: {sum(r['cost'] for r in history):.6f}\", '실행 1회, 통계 비교 없음']\n    (out / 'report.md').write_text('\\n'.join(lines) + '\\n', encoding='utf-8')\n\n\ndef main(argv=None, llm=None, evaluator=None, lookup=None):\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--rounds', type=int, default=3)\n    parser.add_argument('--per-round', type=int, default=5)\n    parser.add_argument('--out', type=Path)\n    parser.add_argument('--resume', type=Path)\n    parser.add_argument('--dry-run', action='store_true')\n    parser.add_argument('--extra-ref', type=Path, nargs='+', default=[])\n    parser.add_argument('--arm', choices=['llm', 'random'], default='llm')\n    parser.add_argument('--domain', choices=['v1', 'v2'], default='v2')\n    parser.add_argument('--seed', type=int, default=0)\n    parser.add_argument('--reject-pubchem', action='store_true')\n    parser.add_argument('--compare', nargs=2, metavar=('A', 'B'))\n    args = parser.parse_args(argv)\n    if args.compare:\n        print(compare_runs(*args.compare), end='')\n        return\n    if args.rounds < 1 or args.per_round < 1 or (args.out and args.resume):\n        parser.error('rounds and per-round must be positive; choose out or resume')\n    out = args.resume or args.out or Path(__file__).with_name('runs') / ('loop-' + datetime.now().strftime('%Y%m%d-%H%M%S'))\n    out.mkdir(parents=True, exist_ok=True)\n    ctx, history = context(), []\n    ctx[\"domain\"] = args.domain\n    add_extra_refs(ctx, args.extra_ref)\n    llm, evaluator, lookup = llm or call_llm, evaluator or evaluate, lookup or pubchem_lookup\n\n    def annotate(proposal, key):\n        result = lookup(key)\n        return {**proposal, \"pubchem_cid\": result[\"cid\"], \"pubchem_status\": result[\"status\"], \"sa_score\": sa_score(proposal[\"smiles\"])}\n    for number in range(1, args.rounds + 1):\n        path = out / f'round_{number}'\n        path.mkdir(exist_ok=True)\n        done = path / 'completed.json'\n        if done.exists():\n            history.append(json.loads(done.read_text()))\n            continue\n        seen = ctx['extra_seen'] | {_inchikey(p['smiles']) for r in history for p in r['accepted']}\n        accepted, rejected, cost = [], [], 0\n        if args.arm == 'llm':\n            for attempt in range(1, 4):\n                text = loop_prompt(ctx, history, args.per_round - len(accepted))\n                if attempt > 1:\n                    text += f\"\\nRejected proposals and reasons: {json.dumps(rejected)}\\nAlready accepted SMILES: {json.dumps([p['smiles'] for p in accepted])}\"\n                (path / f'prompt_{attempt}.txt').write_text(text, encoding='utf-8')\n                if args.dry_run:\n                    return out\n                response_path = path / f'response_{attempt}.json'\n                legacy = path / 'response.json'\n                if response_path.exists():\n                    response = json.loads(response_path.read_text())\n                elif attempt == 1 and legacy.exists():\n                    response = json.loads(legacy.read_text())\n                else:\n                    response = llm(text)\n                    response_path.write_text(json.dumps(response), encoding='utf-8')\n                cost += response.get('total_cost_usd', 0)\n                for proposal in response.get('structured_output', response).get('proposals', []):\n                    smiles = proposal.get('smiles') if isinstance(proposal, dict) else None\n                    if isinstance(proposal, dict):\n                        proposal = {**proposal, 'sa_score': sa_score(smiles) if isinstance(smiles, str) else None}\n                    key = _inchikey(smiles) if isinstance(smiles, str) else None\n                    reason = 'duplicate' if key in ctx['extra_seen'] else check(proposal, ctx, seen)\n                    if not reason and len(accepted) < args.per_round:\n                        proposal = annotate(proposal, key)\n                        if args.reject_pubchem and proposal['pubchem_status'] == 'found':\n                            reason = 'known_pubchem'\n                    if reason:\n                        rejected.append({**proposal, 'reason': reason})\n                    elif len(accepted) >= args.per_round:\n                        rejected.append({**proposal, 'reason': 'round_full'})\n                    else:\n                        seen.add(_inchikey(proposal['smiles']))\n                        accepted.append(proposal)\n                if len(accepted) >= args.per_round:\n                    break\n        else:\n            if args.dry_run:\n                return out\n            # ponytail: a per-round seed makes interrupted runs reproducible without RNG checkpoints.\n            rng = random.Random(f'{args.seed}:{number}')\n            parents = list(ctx['dft']) + [x for r in history for x in r['results']]\n            parents = sorted(o2_feasible(parents), key=lambda x: x['f'], reverse=True)[:5]  # same objective the LLM sees: f among O2-feasible only\n            for _ in range(2000):\n                if len(accepted) >= args.per_round:\n                    break\n                parent = rng.choice(parents)\n                smiles = edit(parent['smiles'], rng.choice(['add', 'replace', 'remove', 'move', 'aza'] if args.domain == 'v2' else ['add', 'replace', 'remove', 'move']), substituents=SUBSTITUENTS if args.domain == 'v2' else sorted(ctx['allowed_subst']), rng=rng)\n                proposal = {'parent_id': parent.get('parent_id', parent.get('id')), 'smiles': smiles, 'edits': ['random_edit'], 'cited_ids': [], 'hypothesis': 'B0 random edit', 'sa_score': sa_score(smiles) if smiles else None}\n                key = _inchikey(smiles) if isinstance(smiles, str) else None\n                reason = 'duplicate' if key in ctx['extra_seen'] else check(proposal, ctx, seen)\n                if not reason:\n                    proposal = annotate(proposal, key)\n                    if args.reject_pubchem and proposal['pubchem_status'] == 'found':\n                        reason = 'known_pubchem'\n                if reason:\n                    rejected.append({**proposal, 'reason': reason})\n                else:\n                    seen.add(_inchikey(smiles))\n                    accepted.append(proposal)\n        with (path / 'input.csv').open('w', newline='', encoding='utf-8') as handle:\n            writer = csv.DictWriter(handle, fieldnames=['id', 'smiles'])\n            writer.writeheader()\n            writer.writerows({'id': f'R{number}-{i}', 'smiles': p['smiles']} for i, p in enumerate(accepted, 1))\n        summary = evaluator(path) if accepted else {'molecules': []}\n        by_key = {x['inchikey']: x for x in summary['molecules']}\n        if any(_inchikey(p['smiles']) not in by_key for p in accepted):\n            raise RuntimeError('Evaluation incomplete; resume after correcting failed calculations')\n        results = [{**p, **score(by_key[_inchikey(p['smiles'])], ctx['line'])} for p in accepted]\n        scores = [x['f'] for r in history for x in r['results']] + [x['f'] for x in results]\n        record = {'round': number, 'accepted': accepted, 'rejected': rejected, 'results': results, 'best_f': max(scores) if scores else None, 'cost': cost, 'arm': args.arm}\n        done.write_text(json.dumps(record), encoding='utf-8')\n        history.append(record)\n        (out / 'ledger.jsonl').write_text(''.join(json.dumps(r) + '\\n' for r in history), encoding='utf-8')\n        report(out, history, ctx, args.arm)\n    if history:\n        (out / 'ledger.jsonl').write_text(''.join(json.dumps(r) + '\\n' for r in history), encoding='utf-8')\n        report(out, history, ctx, args.arm)\n    return out\n\n\nif __name__ == '__main__':\n    main()\n", "generate.py": "\"\"\"Generate and ledger KG-grounded phase-8 quinone proposals.\"\"\"\n\nimport argparse\nimport csv\nimport hashlib\nimport json\nimport random\nimport shutil\nimport subprocess\nfrom collections import Counter\nfrom datetime import datetime\nfrom pathlib import Path\n\nfrom rdflib import Graph, Namespace\nfrom rdflib.namespace import RDF\nfrom rdkit import Chem\n\nfrom loop import QUINONES, edit, in_domain, t0\n\n\nROOT = Path(__file__).resolve().parents[1]\nKG = ROOT / \"phase_5_build\" / \"kg.ttl\"\nSUMMARY = ROOT.parents[0] / \"dft\" / \"runs\" / \"ref_set\" / \"summary.json\"\nSMILES = ROOT / \"phase_4b_extend\" / \"smiles_proposals.csv\"\nEXPANSION = ROOT / \"phase_4b_extend\" / \"reference_expansion.csv\"\nSUBSTITUENTS = [\"F\", \"Cl\", \"Br\", \"C#N\", \"C(F)(F)F\", \"C\", \"OC\", \"O\", \"N\", \"C(=O)OC\", \"S(=O)(=O)C\"]\nQN = Namespace(\"https://w3id.org/quinone#\")\nCORE_SMARTS = (\"O=C1C=CC(=O)C=C1\", \"O=C1C(=O)c2ccccc2C=C1\", \"O=C1C=CC2=CC=CC=C2C1=O\",\n               \"O=C1C=CC(=O)c2ccccc21\", \"O=C1c2ccccc2C(=O)c2ccccc21\", \"O=C1C(=O)c2ccccc2-c2ccccc21\")\n\n\ndef _hash(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\ndef _inchikey(smiles):\n    mol = Chem.MolFromSmiles(smiles)\n    return Chem.MolToInchiKey(mol) if mol else None\n\n\ndef _substituents(smiles, cores=CORE_SMARTS):\n    \"\"\"Return the matched core index and directly attached substituent atom symbols.\"\"\"\n    mol = Chem.MolFromSmiles(smiles)\n    if mol is None:\n        return None, ()\n    for index, value in enumerate(cores):\n        core = Chem.MolFromSmarts(value)\n        if core and mol.HasSubstructMatch(core):\n            atoms = set(mol.GetSubstructMatch(core))\n            return index, tuple(sorted(atom.GetSymbol() for atom in mol.GetAtoms()\n                                       if atom.GetIdx() not in atoms and\n                                       any(n.GetIdx() in atoms for n in atom.GetNeighbors())))\n    # ponytail: use the whole ring scaffold when no legacy core matches.\n    from rdkit.Chem.Scaffolds import MurckoScaffold\n    return Chem.MolToSmiles(MurckoScaffold.GetScaffoldForMol(mol)), ()\n\n\ndef context(kg_path=KG, summary_path=SUMMARY, smiles_path=SMILES):\n    \"\"\"Load compact DFT/KG evidence tables, preserving their source identifiers.\"\"\"\n    summary = json.loads(Path(summary_path).read_text())\n    records, allowed = {}, set()\n    with open(smiles_path, newline=\"\", encoding=\"utf-8\") as handle:\n        for row in csv.DictReader(handle):\n            if row[\"canonical_smiles\"] and row[\"inchikey\"]:\n                records.setdefault(row[\"inchikey\"], row)\n                mol = Chem.MolFromSmiles(row[\"canonical_smiles\"])\n                if mol:\n                    for atom in mol.GetAtoms():\n                        if not atom.IsInRing() and any(neighbor.IsInRing() for neighbor in atom.GetNeighbors()):\n                            allowed.add(atom.GetSymbol())\n    if EXPANSION.exists():\n        with EXPANSION.open(newline=\"\", encoding=\"utf-8\") as handle:\n            for row in csv.DictReader(handle):\n                key = _inchikey(row[\"smiles\"])\n                records.setdefault(key, {\"canonical_smiles\": row[\"smiles\"], \"name\": row[\"name\"]})\n    line, dft = summary[\"line\"], []\n    for index, value in enumerate(summary[\"molecules\"], 1):\n        source = records.get(value[\"inchikey\"])\n        if not source:\n            continue\n        f = (line[\"a\"] * value[\"E2_eV\"] + line[\"b\"] - value[\"dE_bind_kcal\"]) / line[\"sigma\"]\n        dft.append({\"id\": f\"D{index:02d}\", \"smiles\": source[\"canonical_smiles\"], \"inchikey\": value[\"inchikey\"],\n                    \"name\": source[\"name\"], \"E2_eV\": value[\"E2_eV\"], \"dE_bind_kcal\": value[\"dE_bind_kcal\"],\n                    \"co2_detached\": value[\"co2_detached\"], \"o2_margin_V\": value[\"E_O2_eV\"] - value[\"E2_eV\"], \"f\": f})\n    graph, schema = Graph().parse(kg_path, format=\"turtle\"), Namespace(\"https://schema.org/\")\n    kg, kg_inchikeys = [], set()\n    for compound in sorted(graph.subjects(RDF.type, QN.Compound), key=str):\n        name, smiles, key = graph.value(compound, schema.name), graph.value(compound, QN.smiles), graph.value(compound, QN.inchikey)\n        if key:\n            kg_inchikeys.add(str(key))\n        measurements = []\n        for m in graph.subjects(QN.ofCompound, compound):\n            if (m, RDF.type, QN.Measurement) not in graph:\n                continue\n            condition = graph.value(m, QN.underCondition)\n            measurements.append({\"property\": str(graph.value(m, QN.property) or \"\").rsplit(\"#\", 1)[-1], \"value\": str(graph.value(m, QN.value) or \"\"), \"unit\": str(graph.value(m, QN.unit) or \"\").rsplit(\"#\", 1)[-1], \"solvent\": str(graph.value(condition, QN.solvent) or \"\").rsplit(\"#\", 1)[-1], \"reference_electrode\": str(graph.value(condition, QN.referenceElectrode) or \"\").rsplit(\"#\", 1)[-1], \"review_status\": str(graph.value(m, QN.reviewStatus) or \"\")})\n        observations = [str(graph.value(o, QN.outcome) or \"\").rsplit(\"#\", 1)[-1] for o in graph.subjects(QN.ofCompound, compound) if (o, RDF.type, QN.Observation) in graph]\n        if measurements or observations:\n            kg.append({\"id\": f\"K{len(kg)+1:03d}\", \"iri\": str(compound), \"name\": str(name or \"\"), \"smiles\": str(smiles or \"\"), \"inchikey\": str(key or \"\"), \"measurements\": measurements, \"oxygen_observations\": observations})\n    # experimental molecules entered from papers (e.g. Alherz 2022 Table 1) are known, not new, even if not yet in the KG\n    with open(ROOT / \"phase_4b_extend/alherz2022_table1.csv\", newline=\"\") as handle:\n        kg_inchikeys |= {r[\"inchikey\"] for r in csv.DictReader(handle) if r.get(\"inchikey\")}\n    return {\"dft\": dft, \"kg\": kg, \"kg_inchikeys\": kg_inchikeys, \"cores_smarts\": list(CORE_SMARTS), \"allowed_subst\": allowed & {\"F\", \"Cl\", \"Br\", \"N\", \"O\"}, \"ref_fps\": [row[\"smiles\"] for row in dft], \"line\": line}\n\n\ndef sa_score(smiles):\n    try:\n        from rdkit.Contrib.SA_Score import sascorer\n        mol = Chem.MolFromSmiles(smiles)\n        return sascorer.calculateScore(mol) if mol else None\n    except ImportError:\n        return None\n\n\ndef prompt(ctx, previous_smiles):\n    dft = \"\\n\".join(f\"{r['id']} {r['smiles']} E2={r['E2_eV']:.3f} eV bind={r['dE_bind_kcal']:.2f} f={r['f']:.2f} O2margin={r['o2_margin_V']:.3f} detached={r['co2_detached']}\" for r in ctx[\"dft\"])\n    kg = \"\\n\".join(f\"{r['id']} {r['name']} {r['smiles']} {r['measurements']} O2={r['oxygen_observations']}\" for r in ctx[\"kg\"])\n    rules = (\"Use a D parent and D/K citations. Edit only by add/replace/remove/move of F, Cl, Br, NH2, OH; use BQ/NQ/AQ/PQ cores.\" if ctx.get(\"domain\", \"v2\") == \"v1\" else \"Use a D parent and D/K citations. Propose neutral quinones with a ring 1,2- or 1,4-carbonyl pair, only C/H/N/O/F/Cl/Br/S, and at most 30 heavy atoms. Heterocycles and diverse substituents are allowed.\")\n    return f\"\"\"Propose exactly 10 quinone CO2-capture candidates, or return insufficient_evidence.\nGoal: f >= 2 relative to the exchange line, O2 margin >= 0.15 V, and no CO2 detachment.\n{rules}\nDo not repeat these SMILES: {json.dumps(sorted(previous_smiles))}\nReturn JSON {{\\\"proposals\\\":[{{\\\"parent_id\\\":\\\"D01\\\",\\\"smiles\\\":\\\"...\\\",\\\"edits\\\":[\\\"...\\\"],\\\"cited_ids\\\":[\\\"K001\\\"],\\\"hypothesis\\\":\\\"...\\\"}}]}}.\nDFT evidence:\\n{dft}\\nKG evidence:\\n{kg}\"\"\"\n\n\ndef call_llm(text):\n    schema = {\"type\": \"object\", \"properties\": {\"proposals\": {\"type\": \"array\"}, \"reason\": {\"type\": \"string\"}}, \"required\": [\"proposals\"]}\n    result = subprocess.run([str(Path.home() / \".local/bin/claude\"), \"-p\", \"--model\", \"sonnet\", \"--tools\", \"\", \"--output-format\", \"json\", \"--json-schema\", json.dumps(schema), \"--no-session-persistence\", \"--setting-sources\", \"\", \"--strict-mcp-config\"], input=text, text=True, capture_output=True, timeout=900, check=True)\n    return json.loads(result.stdout)\n\n\ndef check(proposal, ctx, seen):\n    smiles = proposal.get(\"smiles\") if isinstance(proposal, dict) else None\n    if not isinstance(smiles, str):\n        return \"invalid_smiles\"\n    domain = ctx.get(\"domain\", \"v2\")\n    reason = t0(smiles, domain) or in_domain(smiles, ctx[\"cores_smarts\"], ctx[\"allowed_subst\"], ctx[\"ref_fps\"], domain=domain)\n    if reason:\n        return reason\n    if not set(proposal.get(\"cited_ids\", [])) <= {row[\"id\"] for row in ctx[\"kg\"] + ctx[\"dft\"]}:  # D (our DFT) and K (literature) are both evidence\n        return \"bad_citation\"\n    if proposal.get(\"parent_id\") not in {row[\"id\"] for row in ctx[\"dft\"]}:\n        return \"bad_parent\"\n    key = _inchikey(smiles)\n    if key in {row[\"inchikey\"] for row in ctx[\"dft\"]} or key in ctx[\"kg_inchikeys\"] or key in seen:\n        return \"duplicate\"\n    return None\n\n\ndef select(checked, n=10):\n    chosen, families = [], set()\n    for row in checked:\n        family = _substituents(row[\"smiles\"])\n        if family not in families:\n            chosen.append(row)\n            families.add(family)\n        if len(chosen) == n:\n            break\n    return chosen\n\n\ndef baseline(ctx, parents_used, n=10, seed=0):\n    rng, targets, rows, seen, attempts = random.Random(seed), Counter(parents_used), [], set(), 0\n    parents = {row[\"id\"]: row for row in ctx[\"dft\"]}\n    for parent_id, count in targets.items():\n        for _ in range(count):\n            while attempts < 2000:\n                attempts += 1\n                smiles = edit(parents[parent_id][\"smiles\"], rng.choice([\"add\", \"replace\", \"remove\", \"move\", \"aza\"] if ctx.get(\"domain\", \"v2\") == \"v2\" else [\"add\", \"replace\", \"remove\", \"move\"]), substituents=SUBSTITUENTS if ctx.get(\"domain\", \"v2\") == \"v2\" else sorted(ctx[\"allowed_subst\"]), rng=rng)\n                row = {\"parent_id\": parent_id, \"smiles\": smiles, \"edits\": [\"random_edit\"], \"cited_ids\": [], \"hypothesis\": \"B0 random edit\", \"arm\": \"b0\"}\n                if smiles and check(row, ctx, seen) is None:\n                    row[\"inchikey\"] = _inchikey(smiles)\n                    seen.add(row[\"inchikey\"])\n                    rows.append(row)\n                    break\n            else:\n                raise RuntimeError(f\"baseline exhausted for {parent_id}\")\n    return rows[:n]\n\n\ndef _write_csv(path, rows):\n    fields = [\"id\", \"smiles\", \"inchikey\", \"parent_id\", \"cited_ids\", \"hypothesis\", \"arm\"]\n    with open(path, \"w\", newline=\"\", encoding=\"utf-8\") as handle:\n        writer = csv.DictWriter(handle, fieldnames=fields, extrasaction=\"ignore\")\n        writer.writeheader()\n        for index, row in enumerate(rows, 1):\n            writer.writerow({**row, \"id\": f\"{row.get('arm', 'llm').upper()}{index:02d}\", \"cited_ids\": \";\".join(row.get(\"cited_ids\", []))})\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--calls\", type=int, default=4)\n    parser.add_argument(\"--replay\", type=Path)\n    parser.add_argument(\"--dry-run\", action=\"store_true\")\n    parser.add_argument(\"--out\", type=Path)\n    parser.add_argument(\"--domain\", choices=[\"v1\", \"v2\"], default=\"v2\")\n    args = parser.parse_args(argv)\n    ctx, seen, checked, responses = context(), set(), [], []\n    ctx[\"domain\"] = args.domain\n    out = args.out or Path(__file__).with_name(\"runs\") / datetime.now().strftime(\"%Y%m%d-%H%M\")\n    out.mkdir(parents=True, exist_ok=True)\n    replay = args.replay.read_text().splitlines() if args.replay else []\n    for index in range(args.calls):\n        text = prompt(ctx, [row[\"smiles\"] for row in checked])  # SMILES, not InChIKeys: the LLM can only avoid what it can read\n        (out / f\"prompt_{index + 1}.txt\").write_text(text, encoding=\"utf-8\")\n        if args.dry_run:\n            break\n        response = json.loads(replay[index]) if args.replay else call_llm(text)\n        responses.append(response)\n        for proposal in response.get(\"structured_output\", response).get(\"proposals\", []):\n            reason, key = check(proposal, ctx, seen), _inchikey(proposal.get(\"smiles\", \"\"))\n            row = {**proposal, \"inchikey\": key, \"reason\": reason, \"sa_score\": sa_score(proposal.get(\"smiles\", \"\"))}\n            if reason is None:\n                seen.add(key)\n                checked.append(row)\n            with open(out / \"ledger.jsonl\", \"a\", encoding=\"utf-8\") as ledger:\n                ledger.write(json.dumps(row, sort_keys=True) + \"\\n\")\n    if args.replay:\n        shutil.copyfile(args.replay, out / \"responses.jsonl\")\n    elif responses:\n        (out / \"responses.jsonl\").write_text(\"\".join(json.dumps(row) + \"\\n\" for row in responses), encoding=\"utf-8\")\n    selected = select(checked)\n    for row in selected:\n        row[\"arm\"] = \"llm\"\n    _write_csv(out / \"selected_llm.csv\", selected)\n    _write_csv(out / \"selected_b0.csv\", baseline(ctx, [row[\"parent_id\"] for row in selected]) if selected else [])\n    manifest = {\"kg_sha256\": _hash(KG), \"summary_sha256\": _hash(SUMMARY), \"calls\": args.calls, \"total_cost_usd\": sum(row.get(\"total_cost_usd\", 0) for row in responses)}\n    (out / \"manifest.json\").write_text(json.dumps(manifest, indent=2), encoding=\"utf-8\")\n    return out\n\n\nif __name__ == \"__main__\":\n    main()\n", "loop.py": "\"\"\"Small, injectable closed-loop scaffold; real xTB and LLM adapters come later.\"\"\"\n\nimport json\nimport random\nfrom collections import Counter\n\nfrom rdkit import Chem, DataStructs\nfrom rdkit.Chem import rdFingerprintGenerator\n\n\nQUINONES = (\"O=C1C=CC(=O)C=C1\", \"O=C1C(=O)c2ccccc2C=C1\", \"O=C1C=CC2=CC=CC=C2C1=O\",\n            \"O=C1C=CC(=O)c2ccccc21\", \"O=C1c2ccccc2C(=O)c2ccccc21\", \"O=C1C(=O)c2ccccc2-c2ccccc21\")\nNON_METALS = {1, 5, 6, 7, 8, 9, 14, 15, 16, 17, 34, 35, 53}\nFP = rdFingerprintGenerator.GetMorganGenerator(radius=2, fpSize=2048)\n\n\ndef _mol(value, smarts=False):\n    return Chem.MolFromSmarts(value) if smarts else Chem.MolFromSmiles(value)\n\n\ndef _positions(mol):\n    return [atom.GetIdx() for atom in mol.GetAtoms()\n            if atom.IsInRing() and atom.GetAtomicNum() == 6 and atom.GetTotalNumHs()]\n\n\ndef _choose(items, rng, selected=None):\n    if not items:\n        return None\n    if selected in items:\n        return selected\n    return rng.choice(items)\n\n\ndef _substituent(substituents, rng, selected=None):\n    return selected or _choose(substituents, rng)\n\n\ndef _add(mol, position, substituent):\n    frag = _mol(substituent)\n    if frag is None or position is None:\n        return None\n    joined = Chem.CombineMols(mol, frag)\n    editable = Chem.RWMol(joined)\n    editable.AddBond(position, mol.GetNumAtoms(), Chem.BondType.SINGLE)\n    try:\n        Chem.SanitizeMol(editable)\n        return Chem.MolToSmiles(editable)\n    except Exception:\n        return None\n\n\ndef _external_neighbors(mol):\n    return [(atom.GetIdx(), neighbor.GetIdx()) for atom in mol.GetAtoms() if atom.IsInRing()\n            for neighbor in atom.GetNeighbors() if not neighbor.IsInRing() and mol.GetBondBetweenAtoms(atom.GetIdx(), neighbor.GetIdx()).GetBondType() == Chem.BondType.SINGLE]\n\n\ndef _remove(mol, ring_idx, sub_idx):\n    editable = Chem.RWMol(mol)\n    editable.RemoveBond(ring_idx, sub_idx)\n    # ponytail: delete the detached substituent fragment; ring-linked substituents are excluded above.\n    fragments = Chem.GetMolFrags(editable, asMols=False, sanitizeFrags=False)\n    removed = next((part for part in fragments if sub_idx in part and ring_idx not in part), ())\n    for idx in sorted(removed, reverse=True):\n        editable.RemoveAtom(idx)\n    try:\n        Chem.SanitizeMol(editable)\n        return Chem.MolToSmiles(editable)\n    except Exception:\n        return None\n\n\ndef edit(smiles, op, *, substituents=(), rng=None, position=None, bond=None, substituent=None):\n    \"\"\"Apply one fixed substituent edit, returning canonical SMILES or ``None``.\"\"\"\n    mol = _mol(smiles)\n    if mol is None:\n        return None\n    rng = rng or random\n    positions = _positions(mol)\n    if op == \"add\":\n        return _add(mol, _choose(positions, rng, position), _substituent(substituents, rng, substituent))\n    if op == \"aza\":\n        choices = [a.GetIdx() for a in mol.GetAtoms() if a.GetIsAromatic() and a.GetAtomicNum() == 6 and a.GetTotalNumHs()]\n        idx = _choose(choices, rng, position)\n        if idx is None:\n            return None\n        editable = Chem.RWMol(mol)\n        editable.GetAtomWithIdx(idx).SetAtomicNum(7)\n        try:\n            Chem.SanitizeMol(editable)\n            return Chem.MolToSmiles(editable)\n        except ValueError:\n            return None\n    external = _external_neighbors(mol)\n    if op == \"remove\":\n        picked = _choose(external, rng, bond)\n        return _remove(mol, *picked) if picked else None\n    if op in {\"replace\", \"move\"}:\n        picked = _choose(external, rng, bond)\n        if not picked:\n            return None\n        cut = Chem.RWMol(mol)\n        cut.RemoveBond(*picked)\n        fragment = next((part for part in Chem.GetMolFrags(cut, asMols=False, sanitizeFrags=False) if picked[1] in part and picked[0] not in part), ())\n        if not fragment:\n            return None\n        old = Chem.MolFragmentToSmiles(mol, atomsToUse=fragment, rootedAtAtom=picked[1], canonical=False)\n        reduced = _remove(mol, *picked)\n        if reduced is None:\n            return None\n        new_mol = _mol(reduced)\n        destination = _choose(_positions(new_mol), rng, position)\n        return _add(new_mol, destination, _substituent(substituents, rng, substituent) if op == \"replace\" else old)\n    return None\n\n\ndef t0(smiles, domain=\"v2\"):\n    \"\"\"Return a rejection reason, or ``None`` for a small, metal-free quinone.\"\"\"\n    mol = _mol(smiles)\n    if mol is None:\n        return \"invalid_smiles\"\n    if domain == \"v2\":\n        if any(a.GetAtomicNum() not in {1, 6, 7, 8, 9, 16, 17, 35} for a in mol.GetAtoms()):\n            return \"metal\"\n        if any(a.GetFormalCharge() for a in mol.GetAtoms()) or len(Chem.GetMolFrags(mol)) != 1:\n            return \"charged_or_disconnected\"\n        if mol.GetNumHeavyAtoms() > 30:\n            return \"too_many_heavy_atoms\"\n        carbonyls = {a.GetIdx() for a in mol.GetAtoms() if a.GetAtomicNum() == 6 and any(n.GetAtomicNum() == 8 and mol.GetBondBetweenAtoms(a.GetIdx(), n.GetIdx()).GetBondType() == Chem.BondType.DOUBLE for n in a.GetNeighbors())}\n        if not any(len(r) >= 4 and all(mol.GetAtomWithIdx(i).GetAtomicNum() in {6, 7, 16} for i in r) and any(r[i] in carbonyls and r[(i + d) % len(r)] in carbonyls for i in range(len(r)) for d in (1, 3)) for r in mol.GetRingInfo().AtomRings()):\n            return \"not_quinone\"\n        return None\n    if any(atom.GetAtomicNum() not in NON_METALS for atom in mol.GetAtoms()):\n        return \"metal\"\n    if mol.GetNumHeavyAtoms() > 40:\n        return \"too_many_heavy_atoms\"\n    if not any(mol.HasSubstructMatch(_mol(pattern, smarts=True)) for pattern in QUINONES):\n        return \"not_quinone\"\n    return None\n\n\ndef _pattern(value):\n    return _mol(value, smarts=True) or _mol(value)\n\n\ndef in_domain(smiles, cores_smarts=None, allowed_subst=None, ref_fps=None, domain=\"v2\"):\n    \"\"\"Check the phase-7 core, substituent, and fingerprint support contract.\"\"\"\n    if domain == \"v2\":\n        return t0(smiles)\n    mol = _mol(smiles)\n    if mol is None:\n        return \"out_of_domain_core\"\n    patterns = [_pattern(core) for core in cores_smarts]\n    match = next((mol.GetSubstructMatch(pattern) for pattern in patterns\n                  if pattern and mol.HasSubstructMatch(pattern)), ())\n    if not match:\n        return \"out_of_domain_core\"\n    core_atoms = set(match)\n    for atom in mol.GetAtoms():\n        if atom.GetIdx() in core_atoms:\n            continue\n        if any(neighbor.GetIdx() in core_atoms for neighbor in atom.GetNeighbors()):\n            subst = Chem.MolFragmentToSmiles(mol, [atom.GetIdx()], canonical=True)\n            if subst not in allowed_subst and atom.GetSymbol() not in allowed_subst:\n                return \"unregistered_substituent\"\n    candidate = FP.GetFingerprint(mol)\n    refs = [FP.GetFingerprint(_mol(ref)) if isinstance(ref, str) else ref for ref in ref_fps]\n    if not refs or max(DataStructs.TanimotoSimilarity(candidate, ref) for ref in refs) < 0.4:\n        return \"out_of_domain_similarity\"\n    return None\n\n\ndef objective(E2, dG, a, b, sigma, o2_E, margin=0.15):\n    if sigma == 0 or E2 < o2_E + margin:\n        return None\n    return (a * E2 + b - dG) / sigma\n\n\ndef _score(evaluate, smiles):\n    try:\n        value = evaluate(smiles)\n    except Exception as exc:\n        return None, {\"reason\": f\"calculation_fail: {type(exc).__name__}\"}\n    if isinstance(value, (int, float)):\n        return float(value), {\"f\": float(value)}\n    if not isinstance(value, dict):\n        return None, {\"reason\": \"calculation_fail\" if value is None else str(value)}\n    if value.get(\"reason\"):\n        return None, value\n    score = value.get(\"f\")\n    if score is None and all(key in value for key in (\"E2\", \"dG\", \"a\", \"b\", \"sigma\", \"o2_E\")):\n        score = objective(value[\"E2\"], value[\"dG\"], value[\"a\"], value[\"b\"], value[\"sigma\"], value[\"o2_E\"])\n    return score, value if score is not None else {**value, \"reason\": \"o2_fail\"}\n\n\ndef run(propose, evaluate, start, budget=80, rounds=8, k=5, feedback=True, ledger_path=\"ledger.jsonl\",\n        cores_smarts=None, allowed_subst=None, ref_fps=None, domain=\"v2\"):\n    \"\"\"Run exactly ``budget`` proposals and return the running-best score curve.\"\"\"\n    start_records = []\n    for item in start:\n        smiles = item[\"smiles\"] if isinstance(item, dict) else item\n        score = item.get(\"f\") if isinstance(item, dict) else None\n        if score is None and t0(smiles, domain) is None:\n            score, _ = _score(evaluate, smiles)\n        if score is not None:\n            start_records.append({\"smiles\": smiles, \"f\": float(score)})\n    best = max((record[\"f\"] for record in start_records), default=float(\"-inf\"))\n    seen = {record[\"smiles\"] for record in start_records}\n    start_smiles = sorted(seen)\n    failures, curve, exhausted, pending = Counter(), [], False, []\n    cores_smarts = cores_smarts or QUINONES\n    allowed_subst = set() if allowed_subst is None else allowed_subst\n    ref_fps = ref_fps or [record[\"smiles\"] for record in start_records]\n    ledger_path = str(ledger_path)\n    with open(ledger_path, \"w\", encoding=\"utf-8\") as ledger:\n        for step in range(budget):\n            round_index = step * rounds // budget\n            if feedback:\n                context = {\"top\": sorted(start_records, key=lambda record: record[\"f\"], reverse=True)[:k],\n                           \"failures\": dict(failures), \"previous_smiles\": sorted(seen),\n                           \"start_smiles\": start_smiles, \"round\": round_index}\n            else:\n                context = {\"previous_smiles\": sorted(seen),\n                           \"start_smiles\": start_smiles, \"round\": round_index}\n            # ponytail: JSONL is the only ledger; add RDF when runs must query each other.\n            if not exhausted and not pending:\n                pending = list(propose(context))\n            item = pending.pop(0) if pending and not exhausted else {\"reason\": \"insufficient_evidence\"}\n            proposal = item.get(\"smiles\") if isinstance(item, dict) else None\n            row = {\"step\": step + 1, \"round\": round_index + 1, \"proposal\": proposal,\n                   \"t0\": None, \"domain\": None, \"E2\": None, \"dG\": None, \"f\": None, \"reason\": None}\n            if isinstance(item, dict) and item.get(\"reason\") == \"insufficient_evidence\":\n                reason = \"insufficient_evidence\"\n                exhausted = True\n            elif not isinstance(proposal, str) or not proposal:\n                reason = \"invalid_smiles\"\n            elif proposal in seen:\n                reason = \"duplicate\"\n            else:\n                reason = t0(proposal, domain)\n                row[\"t0\"] = reason\n            if reason is None:\n                row[\"domain\"] = in_domain(proposal, cores_smarts, allowed_subst, ref_fps, domain=domain)\n                if row[\"domain\"]:\n                    reason = \"out_of_domain\"\n                else:\n                    score, details = _score(evaluate, proposal)\n                    row.update({key: details.get(key) for key in (\"E2\", \"dG\")})\n                    reason = details.get(\"reason\") if score is None else None\n                    row[\"f\"] = score\n                    if score is not None:\n                        seen.add(proposal)\n                        start_records.append({\"smiles\": proposal, \"f\": float(score)})\n                        best = max(best, float(score))\n            if reason:\n                failures[reason] += 1\n            row[\"reason\"], row[\"best_f\"] = reason, best\n            ledger.write(json.dumps(row, sort_keys=True) + \"\\n\")\n            curve.append(best)\n    return curve\n\n\ndef auc(best_curve, start_best):\n    return sum(value - start_best for value in best_curve)\n\n\ndef random_proposer(allowed_subst, seed=0):\n    \"\"\"B0 baseline: uniformly choose a parent and fixed edit operation.\"\"\"\n    # ponytail: one seeded stdlib RNG is enough until paired-run orchestration exists.\n    rng = random.Random(seed)\n\n    def propose(context):\n        parents = context.get(\"top\", []) or [{\"smiles\": smiles} for smiles in context[\"start_smiles\"]]\n        if not parents:\n            return [{\"reason\": \"insufficient_evidence\"}]\n        parent = rng.choice(parents)[\"smiles\"]\n        return [{\"smiles\": edit(parent, rng.choice([\"add\", \"replace\", \"remove\", \"move\"]),\n                                substituents=allowed_subst, rng=rng)}]\n\n    return propose\n", "pubchem.py": "\"\"\"Cached PubChem PUG REST lookup by InChIKey.\"\"\"\nimport json\nimport time\nfrom pathlib import Path\nfrom urllib.error import HTTPError\nfrom urllib.parse import quote\nfrom urllib.request import urlopen\n\nCACHE = Path(__file__).resolve().parents[1] / 'data/pubchem_cache.json'\n_last_call = 0.0\n\n\ndef _fetch(url, timeout):\n    with urlopen(url, timeout=timeout) as response:\n        return json.load(response)\n\n\ndef lookup(inchikey, fetch=None):\n    global _last_call\n    try:\n        cache = json.loads(CACHE.read_text()) if CACHE.exists() else {}\n        if inchikey in cache:\n            return cache[inchikey]\n        # ponytail: process-local spacing; a shared limiter is needed for concurrent processes.\n        time.sleep(max(0, .25 - (time.monotonic() - _last_call)))\n        _last_call = time.monotonic()\n        url = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/inchikey/' + quote(inchikey, safe='') + '/property/IUPACName,MolecularFormula/JSON'\n        try:\n            prop = (fetch or _fetch)(url, timeout=15)['PropertyTable']['Properties'][0]\n            result = {'cid': int(prop['CID']), 'iupac': prop.get('IUPACName'), 'status': 'found'}\n        except HTTPError as exc:\n            if exc.code != 404:\n                raise\n            result = {'cid': None, 'iupac': None, 'status': 'not_found'}\n        except Exception:  # A failing fetch must not reject or cache a candidate.\n            return {'cid': None, 'iupac': None, 'status': 'error'}\n        cache[inchikey] = result\n        CACHE.parent.mkdir(parents=True, exist_ok=True)\n        CACHE.write_text(json.dumps(cache, indent=2, sort_keys=True) + '\\n')\n        return result\n    except (OSError, ValueError, KeyError, IndexError, TypeError):\n        return {'cid': None, 'iupac': None, 'status': 'error'}\n", "qextract/pipeline.py": "\"\"\"Extract one paper: ask, check, send the refusals back, keep the best attempt.\"\"\"\n\nimport dataclasses\nimport json\nimport re\nfrom collections.abc import Callable, Sequence\nfrom dataclasses import dataclass\n\nfrom pydantic import BaseModel, JsonValue, TypeAdapter, ValidationError\n\nfrom .checker import Checked, DanglingReference, Dropped, MalformedItem, Problem, check, describe\nfrom .llm import Message\nfrom .prompt import repair_message, user_message\nfrom .record import CompoundRec, ConditionRec, MeasurementRec, ObservationRec, PaperRecord\nfrom .text import Page\nfrom .vocab import Vocabulary\n\ntype ChatFn = Callable[[Sequence[Message]], str]\n\n_FENCE = re.compile(r\"^```(?:json)?\\s*|\\s*```$\")\n\n\n@dataclass(frozen=True, slots=True)\nclass PaperInput:\n    \"\"\"What the model reads: the paper's pages, or its abstract as one pseudo page.\"\"\"\n\n    paper_id: str\n    title: str\n    pages: tuple[Page, ...]\n    abstract_only: bool\n\n\n@dataclass(frozen=True, slots=True)\nclass Attempt:\n    \"\"\"One round trip with the model.\"\"\"\n\n    number: int\n    parse_errors: tuple[str, ...]\n    kept: int\n    dropped: int\n\n\n@dataclass(frozen=True, slots=True)\nclass Outcome:\n    \"\"\"The best attempt's checked record, the model's not_reported notes, and the attempt log.\"\"\"\n\n    checked: Checked\n    not_reported: tuple[str, ...]\n    attempts: tuple[Attempt, ...]\n\n\ndef _kept(c: Checked) -> int:\n    return len(c.compounds) + len(c.conditions) + len(c.measurements) + len(c.observations)\n\n\ndef _lines(checked: Checked) -> list[str]:\n    problems: list[Problem] = [p for d in checked.dropped for p in d.problems]\n    roots = [describe(p) for p in problems if not isinstance(p, DanglingReference)]\n    keys: dict[str, int] = {}\n    for p in problems:\n        if isinstance(p, DanglingReference):\n            keys[p.key] = keys.get(p.key, 0) + 1\n    effects = [\n        f\"'{k}' was refused or is missing, so {n} result(s) that use it were refused too; fix '{k}' first\"\n        for k, n in keys.items()\n    ]\n    return [*effects, *roots]\n\n\n_JSON: TypeAdapter[JsonValue] = TypeAdapter(JsonValue)\n_ITEM_MODELS: dict[str, type[BaseModel]] = {\n    \"compounds\": CompoundRec,\n    \"conditions\": ConditionRec,\n    \"measurements\": MeasurementRec,\n    \"observations\": ObservationRec,\n}\n\n\ndef _clip(value: JsonValue, limit: int = 300) -> JsonValue:\n    if isinstance(value, str):\n        return value if len(value) <= limit else f\"{value[:limit]}... ({len(value)} characters)\"\n    if isinstance(value, list):\n        return [_clip(v, limit) for v in value]\n    if isinstance(value, dict):\n        return {k: _clip(v, limit) for k, v in value.items()}\n    return value\n\n\ndef _errors(e: ValidationError) -> str:\n    return \"; \".join(f\"{'.'.join(str(p) for p in err['loc'])}: {err['msg']}\" for err in e.errors()[:4])\n\n\n@dataclass(frozen=True, slots=True)\nclass Parsed:\n    \"\"\"A reply that held a JSON object: the items that have the right shape and those that do not.\"\"\"\n\n    record: PaperRecord\n    malformed: tuple[Dropped, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass Unreadable:\n    \"\"\"A reply that is not one JSON object; nothing in it can be used.\"\"\"\n\n    reasons: tuple[str, ...]\n\n\ntype ParseResult = Parsed | Unreadable\n\n\ndef _parse(reply: str) -> ParseResult:\n    try:\n        raw = _JSON.validate_json(_FENCE.sub(\"\", reply.strip()))\n    except ValidationError as e:\n        return Unreadable((f\"not valid JSON: {e.errors()[0]['msg']}\",))\n    if not isinstance(raw, dict):\n        return Unreadable((\"the reply must be one JSON object\",))\n    good: dict[str, list[BaseModel]] = {name: [] for name in _ITEM_MODELS}\n    bad: list[Dropped] = []\n    for name, model in _ITEM_MODELS.items():\n        items = raw.get(name, [])\n        if not isinstance(items, list):\n            return Unreadable((f\"{name} must be a list\",))\n        for i, item in enumerate(items):\n            try:\n                good[name].append(model.model_validate(item))\n            except ValidationError as e:\n                problem = MalformedItem(where=f\"{name}[{i}]\", message=_errors(e))\n                bad.append(\n                    Dropped(\n                        kind=name.removesuffix(\"s\"),\n                        raw=json.dumps(_clip(item), ensure_ascii=False),\n                        problems=(problem,),\n                    )\n                )\n    notes = raw.get(\"not_reported\", [])\n    record = PaperRecord(\n        compounds=tuple(i for i in good[\"compounds\"] if isinstance(i, CompoundRec)),\n        conditions=tuple(i for i in good[\"conditions\"] if isinstance(i, ConditionRec)),\n        measurements=tuple(i for i in good[\"measurements\"] if isinstance(i, MeasurementRec)),\n        observations=tuple(i for i in good[\"observations\"] if isinstance(i, ObservationRec)),\n        not_reported=tuple(str(n) for n in notes) if isinstance(notes, list) else (),\n    )\n    return Parsed(record, tuple(bad))\n\n\ndef extract(paper: PaperInput, vocab: Vocabulary, system: str, chat_fn: ChatFn, *, retries: int = 3) -> Outcome:\n    \"\"\"Ask for a record, check it, send refusals back up to `retries` times; return the attempt that kept the most.\"\"\"\n    text = \"\".join(f\"\\n===== PAGE {p.number} =====\\n{p.text}\" for p in paper.pages)\n    messages = [\n        Message(\"system\", system),\n        Message(\"user\", user_message(paper.title, text, abstract_only=paper.abstract_only)),\n    ]\n    best: tuple[Checked, tuple[str, ...]] | None = None\n    attempts: list[Attempt] = []\n    for n in range(1, retries + 2):\n        reply = chat_fn(messages)\n        match _parse(reply):\n            case Unreadable(reasons=reasons):\n                attempts.append(Attempt(n, reasons, 0, 0))\n                messages += [\n                    Message(\"assistant\", reply),\n                    Message(\"user\", repair_message([f\"JSON format: {e}\" for e in reasons])),\n                ]\n                continue\n            case Parsed(record=record, malformed=malformed):\n                checked = check(record, paper.pages, vocab, abstract=paper.abstract_only)\n                checked = dataclasses.replace(checked, dropped=(*malformed, *checked.dropped))\n        attempts.append(Attempt(n, (), _kept(checked), len(checked.dropped)))\n        if best is None or _kept(checked) > _kept(best[0]):\n            best = (checked, record.not_reported)\n        if not checked.dropped:\n            break\n        messages += [Message(\"assistant\", reply), Message(\"user\", repair_message(_lines(checked)))]\n    if best is None:\n        empty = Checked((), (), (), (), ())\n        return Outcome(empty, (), tuple(attempts))\n    return Outcome(best[0], best[1], tuple(attempts))\n\n\ndef render(paper: PaperInput, outcome: Outcome) -> str:\n    \"\"\"The saved record as JSON text: kept items with their pages, dropped items with reasons, the attempt log.\"\"\"\n    c = outcome.checked\n\n    def items(located: Sequence[object]) -> list[JsonValue]:\n        out: list[JsonValue] = []\n        for loc in located:\n            item = getattr(loc, \"item\")  # noqa: B009\n            out.append({**json.loads(item.model_dump_json()), \"page\": getattr(loc, \"page\")})  # noqa: B009\n        return out\n\n    doc: dict[str, JsonValue] = {\n        \"paper_id\": paper.paper_id,\n        \"title\": paper.title,\n        \"evidence_source\": \"Abstract\" if paper.abstract_only else \"FullText\",\n        \"compounds\": items(c.compounds),\n        \"conditions\": items(c.conditions),\n        \"measurements\": items(c.measurements),\n        \"observations\": items(c.observations),\n        \"not_reported\": list(outcome.not_reported),\n        \"dropped\": [\n            {\"kind\": d.kind, \"raw\": json.loads(d.raw), \"reasons\": [describe(p) for p in d.problems]} for d in c.dropped\n        ],\n        \"attempts\": [\n            {\"n\": a.number, \"parse_errors\": list(a.parse_errors), \"kept\": a.kept, \"dropped\": a.dropped}\n            for a in outcome.attempts\n        ],\n        \"review_status\": \"machine_extracted\",\n    }\n    return json.dumps(doc, ensure_ascii=False, indent=1)\n", "build.py": "\"\"\"Phase 5: records_final/*.json (+ 4b tables) -> kg.ttl. Run: ../../.venv/bin/python build.py\"\"\"\nimport csv\nimport hashlib\nimport json\nfrom pathlib import Path\nfrom urllib.parse import quote\n\nfrom rdflib import RDF, Graph, Literal, Namespace, URIRef\nfrom rdflib.namespace import XSD\n\nONTO = Path(__file__).resolve().parents[1]\nPUBCHEM_CACHE = ONTO / \"data/pubchem_cache.json\"\nQN = Namespace(\"https://w3id.org/quinone#\")\nE = Namespace(\"https://w3id.org/quinone/entity/\")\nS = Namespace(\"https://schema.org/\")\n\n\ndef _iri(*parts) -> URIRef:\n    return E[\"-\".join(quote(str(p), safe=\"\") for p in parts)]\n\n\ndef build(skipped: list | None = None) -> str:\n    skipped = [] if skipped is None else skipped  # filled with (paper, node id, quote) of results left out\n    g = Graph()\n    g.bind(\"qn\", QN), g.bind(\"e\", E), g.bind(\"schema\", S)\n    cache = json.loads(PUBCHEM_CACHE.read_text()) if PUBCHEM_CACHE.exists() else {}\n    master = {m[\"id\"]: m for m in json.loads((ONTO / \"phase_3_corpus/master.json\").read_text(encoding=\"utf-8\"))}\n    tier = {r[\"doi\"]: r[\"xlsx_tier\"] for r in csv.DictReader(open(ONTO / \"phase_4b_extend/xlsx_status.csv\", encoding=\"utf-8\"))}\n    smiles = {(r[\"paper_id\"], r[\"compound\"]): r for r in\n              csv.DictReader(open(ONTO / \"phase_4b_extend/smiles_proposals.csv\", encoding=\"utf-8\")) if r[\"canonical_smiles\"]}\n\n    def evidence(pid, source, quote_, page):\n        ev = _iri(\"ev\", pid, hashlib.sha1(f\"{quote_}|{page}\".encode()).hexdigest()[:10])\n        g.add((ev, RDF.type, QN.Evidence))\n        g.add((ev, QN.evidenceSource, QN[source]))\n        g.add((ev, QN.quote, Literal(quote_)))\n        if page:\n            g.add((ev, QN.page, Literal(page, datatype=XSD.integer)))\n        return ev\n\n    for f in sorted((ONTO / \"phase_4_extract/records_final\").glob(\"*.json\")):\n        rec = json.loads(f.read_text(encoding=\"utf-8\"))\n        pid, src = rec[\"paper_id\"], rec[\"evidence_source\"]\n        paper = _iri(\"paper\", pid)\n        g.add((paper, RDF.type, QN.Paper))\n        g.add((paper, S.name, Literal(rec[\"title\"])))\n        g.add((paper, S.identifier, Literal(master[pid][\"doi\"])))\n        g.add((paper, S.datePublished, Literal(str(master[pid][\"year\"]))))\n        if master[pid][\"doi\"] in tier:\n            g.add((paper, QN.simReviewTier, Literal(tier[master[pid][\"doi\"]])))\n\n        for c in rec[\"compounds\"]:\n            cpd = _iri(\"cpd\", pid, c[\"key\"])\n            g.add((cpd, RDF.type, QN.Compound))\n            g.add((cpd, S.name, Literal(c[\"name\"])))\n            g.add((cpd, QN.skeleton, QN[c[\"skeleton\"]]))\n            g.add((cpd, QN.form, QN[c[\"form\"]]))\n            for sc in c[\"substituent_classes\"]:\n                g.add((cpd, QN.substituentClass, QN[sc]))\n            if c[\"substituent_text\"]:\n                g.add((cpd, QN.substituentText, Literal(c[\"substituent_text\"])))\n            if (pid, c[\"key\"]) in smiles:\n                p = smiles[pid, c[\"key\"]]\n                g.add((cpd, QN.smiles, Literal(p[\"canonical_smiles\"])))\n                g.add((cpd, QN.inchikey, Literal(p[\"inchikey\"])))\n                hit = cache.get(p[\"inchikey\"], {})\n                if hit.get(\"status\") == \"found\" and hit.get(\"cid\") is not None:\n                    g.add((cpd, QN.pubchemCID, Literal(hit[\"cid\"], datatype=XSD.integer)))\n                g.add((cpd, QN.smilesSource, Literal(\"llm_checked\")))\n\n        for c in rec[\"conditions\"]:\n            cond = _iri(\"cond\", pid, c[\"key\"])\n            g.add((cond, RDF.type, QN.Condition))\n            g.add((cond, QN.solvent, QN[c[\"solvent\"]]))\n            g.add((cond, QN.referenceElectrode, QN[c[\"reference_electrode\"]]))\n            g.add((cond, QN.atmosphere, QN[c[\"atmosphere\"]]))\n            for k, p in ((\"electrolyte_text\", QN.electrolyteText), (\"additive_text\", QN.additiveText)):\n                if c[k]:\n                    g.add((cond, p, Literal(c[k])))\n            if c[\"ph\"] is not None:\n                g.add((cond, QN.pH, Literal(str(c[\"ph\"]), datatype=XSD.decimal)))\n            if c[\"temperature_k\"] is not None:\n                g.add((cond, QN.temperatureK, Literal(str(c[\"temperature_k\"]), datatype=XSD.decimal)))\n\n        def result(node, cls, r):\n            if len(r[\"quote\"]) < 20:  # EvidenceShape: quote >= 20 chars; the quote is data, so the result is left out, not padded\n                skipped.append((pid, node.split(\"/\")[-1], r[\"quote\"]))\n                return False\n            g.add((node, RDF.type, cls))\n            g.add((node, QN.ofCompound, _iri(\"cpd\", pid, r[\"compound\"])))\n            g.add((node, QN.underCondition, _iri(\"cond\", pid, r[\"condition\"])))\n            g.add((node, QN.fromPaper, paper))\n            g.add((node, QN.hasEvidence, evidence(pid, src, r[\"quote\"], r[\"page\"])))\n            g.add((node, QN.reviewStatus, Literal(rec[\"review_status\"])))\n            return True\n\n        for i, m in enumerate(rec[\"measurements\"]):\n            node = _iri(\"m\", pid, i)\n            if not result(node, QN.Measurement, m):\n                continue\n            g.add((node, QN.property, QN[m[\"property\"]]))\n            g.add((node, QN.value, Literal(str(m[\"value\"]), datatype=XSD.decimal)))\n            g.add((node, QN.unit, QN[m[\"unit\"]]))\n            g.add((node, QN.basis, QN[m[\"basis\"]]))\n            g.add((node, QN.method, QN[m[\"method\"]]))\n            if m[\"redox_couple\"]:\n                g.add((node, QN.redoxCouple, QN[m[\"redox_couple\"]]))\n        for i, o in enumerate(rec[\"observations\"]):\n            node = _iri(\"o\", pid, i)\n            if not result(node, QN.Observation, o):\n                continue\n            g.add((node, QN.observationKind, QN[o[\"kind\"]]))\n            g.add((node, QN.outcome, QN[o[\"outcome\"]]))\n\n    # ponytail: rdflib turtle sorts subjects/predicates/objects, so no extra canonicalization (no blank nodes are emitted)\n    return g.serialize(format=\"turtle\")\n\n\nif __name__ == \"__main__\":\n    out = Path(__file__).with_name(\"kg.ttl\")\n    skipped = []\n    out.write_text(build(skipped), encoding=\"utf-8\")\n    print(f\"wrote {out}; skipped {len(skipped)} results with quote < 20 chars\")\n", "dft.py": "\"\"\"Small DFT geometry helpers for the phase-7 quinone benchmark.\"\"\"\n\nimport json\nimport time\nfrom pathlib import Path\n\nimport numpy as np\nfrom pyscf import dft, gto\nfrom pyscf.geomopt import geometric_solver\nfrom rdkit import Chem\nfrom rdkit.Chem import AllChem\n\n\ndef embed(smiles, seed=0):\n    \"\"\"Embed an RDKit molecule with hydrogens and return Angstrom coordinates.\"\"\"\n    mol = Chem.AddHs(Chem.MolFromSmiles(smiles))\n    params = AllChem.ETKDGv3()\n    params.randomSeed = seed\n    if AllChem.EmbedMolecule(mol, params) != 0:\n        raise ValueError(f\"could not embed {smiles!r}\")\n    AllChem.MMFFOptimizeMolecule(mol)\n    conformer = mol.GetConformer()\n    return [atom.GetSymbol() for atom in mol.GetAtoms()], np.array(conformer.GetPositions())\n\n\ndef co2_adduct(symbols, coords, o_index):\n    \"\"\"Place a bent CO2 group 1.45 Angstrom from carbonyl oxygen ``o_index``.\"\"\"\n    coords = np.asarray(coords, dtype=float)\n    oxygen = coords[o_index]\n    carbon = coords[min((index for index, symbol in enumerate(symbols) if symbol == \"C\"),\n                        key=lambda index: np.linalg.norm(coords[index] - oxygen))]\n    direction = oxygen - carbon\n    direction /= np.linalg.norm(direction)\n    axis = np.cross(direction, [1.0, 0.0, 0.0])\n    if np.linalg.norm(axis) < 1e-6:\n        axis = np.cross(direction, [0.0, 1.0, 0.0])\n    axis /= np.linalg.norm(axis)\n    co2_c = oxygen + 1.45 * direction\n    half_angle = np.deg2rad(65.0)\n    co2_o1 = co2_c + 1.16 * (direction * np.cos(half_angle) + axis * np.sin(half_angle))\n    co2_o2 = co2_c + 1.16 * (direction * np.cos(half_angle) - axis * np.sin(half_angle))\n    return list(symbols) + [\"C\", \"O\", \"O\"], np.vstack([coords, co2_c, co2_o1, co2_o2])\n\n\ndef write_xyz_text(symbols, coords):\n    return f\"{len(symbols)}\\n\\n\" + \"\\n\".join(\n        f\"{symbol} {x:.10f} {y:.10f} {z:.10f}\" for symbol, (x, y, z) in zip(symbols, coords)\n    ) + \"\\n\"\n\n\ndef write_xyz(path, symbols, coords):\n    Path(path).write_text(write_xyz_text(symbols, coords), encoding=\"utf-8\")\n\n\ndef save_json(path, value):\n    Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n\n\ndef _method(mol, spin, xc, disp, solvent, gpu):\n    if gpu:\n        from gpu4pyscf import dft as gpu_dft\n        method = gpu_dft.RKS(mol, xc=xc) if spin == 0 else gpu_dft.UKS(mol, xc=xc)\n    else:\n        method = dft.RKS(mol, xc=xc) if spin == 0 else dft.UKS(mol, xc=xc)\n    method.disp = disp\n    if solvent:\n        method = method.SMD()\n        method.with_solvent.solvent = solvent\n    return method\n\n\ndef _molecule(symbols, coords, charge, spin, basis):\n    return gto.M(atom=list(zip(symbols, coords)), charge=charge, spin=spin, basis=basis,\n                 unit=\"Angstrom\", verbose=0)\n\n\ndef optimize(symbols, coords, charge, spin, xc=\"b3lyp\", disp=\"d3bj\", basis=\"def2-svp\",\n             solvent=\"acetonitrile\", gpu=True):\n    \"\"\"Optimize one state and return results instead of propagating calculation errors.\"\"\"\n    started, steps = time.monotonic(), [0]\n    result = {\"energy\": None, \"xyz\": None, \"seconds\": 0.0, \"steps\": 0, \"converged\": False, \"geom_converged\": False,\n              \"max_gpu_memory\": 0, \"error\": None}\n    memory_pool = None\n    try:\n        if gpu:\n            import cupy\n            memory_pool = cupy.get_default_memory_pool()\n            memory_pool.free_all_blocks()\n        mol = _molecule(symbols, coords, charge, spin, basis)\n        method = _method(mol, spin, xc, disp, solvent, gpu)\n        method.kernel()\n        if not method.converged:\n            # ponytail: one level-shift retry; diagnose persistent SCF failures before adding heuristics.\n            method.level_shift = 0.2\n            method.kernel()\n        if not method.converged:\n            raise RuntimeError(\"SCF did not converge\")\n        geom_converged, optimized = geometric_solver.kernel(method, callback=lambda _: steps.__setitem__(0, steps[0] + 1))\n        method = _method(optimized, spin, xc, disp, solvent, gpu)\n        energy = method.kernel()\n        if not method.converged:\n            method.level_shift = 0.2\n            energy = method.kernel()\n        result.update({\"energy\": float(energy), \"xyz\": write_xyz_text(\n            [optimized.atom_symbol(i) for i in range(optimized.natm)], optimized.atom_coords(unit=\"Angstrom\")),\n            \"steps\": steps[0], \"converged\": bool(method.converged), \"geom_converged\": bool(geom_converged)})\n        if not method.converged:\n            result[\"error\"] = \"SCF did not converge\"\n    except Exception as exc:\n        result[\"error\"] = f\"{type(exc).__name__}: {exc}\"\n    if memory_pool is not None:\n        # ponytail: pool capacity approximates peak use; add a profiler only when memory is constrained.\n        result[\"max_gpu_memory\"] = memory_pool.total_bytes()\n    result[\"seconds\"] = time.monotonic() - started\n    return result\n", "run_set.py": "\"\"\"Run and summarize the phase-7 quinone DFT reference set.\"\"\"\n\nimport argparse\nimport csv\nimport json\nimport multiprocessing as mp\nimport os\nimport shutil\nfrom pathlib import Path\n\nimport numpy as np\nfrom rdkit import Chem\n\nfrom dft import co2_adduct, embed, optimize, save_json\n\n\nROOT = Path(__file__).resolve().parents[1]\nINPUT = ROOT / \"onto\" / \"phase_4b_extend\" / \"smiles_proposals.csv\"\nOUT = Path(__file__).parent / \"runs\" / \"ref_set\"\n\n\ndef reference_set(csv_path):\n    grouped = {}\n    with open(csv_path, newline=\"\", encoding=\"utf-8\") as handle:\n        for row in csv.DictReader(handle):\n            if row[\"canonical_smiles\"] and row[\"inchikey\"]:\n                grouped.setdefault(row[\"inchikey\"], []).append(row)\n    return [{\"inchikey\": inchikey, \"smiles\": rows[0][\"canonical_smiles\"],\n             \"sources\": \";\".join(f\"{row['paper_id']}:{row['compound']}\" for row in rows)}\n            for inchikey, rows in grouped.items()]\n\n\ndef input_set(csv_path):\n    \"\"\"Read phase-8 selections; compute an InChIKey only when CSV omitted it.\"\"\"\n    with open(csv_path, newline=\"\", encoding=\"utf-8\") as handle:\n        return [{\"inchikey\": row.get(\"inchikey\") or Chem.MolToInchiKey(Chem.MolFromSmiles(row[\"smiles\"])),\n                 \"smiles\": row[\"smiles\"], \"sources\": row[\"id\"], **({\"class\": row[\"class\"]} if row.get(\"class\") else {})} for row in csv.DictReader(handle)]\n\n\ndef carbonyl_sites(smiles):\n    mol = Chem.MolFromSmiles(smiles)\n    ranks, sites = Chem.CanonicalRankAtoms(mol, breakTies=False), []\n    for carbon in mol.GetAtoms():\n        for oxygen in carbon.GetNeighbors():\n            bond = mol.GetBondBetweenAtoms(carbon.GetIdx(), oxygen.GetIdx())\n            if carbon.GetSymbol() == \"C\" and oxygen.GetSymbol() == \"O\" and bond.GetBondType() == Chem.BondType.DOUBLE:\n                if ranks[oxygen.GetIdx()] not in {ranks[site] for site in sites}:\n                    sites.append(oxygen.GetIdx())\n    return sites\n\n\ndef _done(value):\n    return bool(value and value.get(\"converged\") and value.get(\"geom_converged\") and not value.get(\"error\"))\n\n\ndef _xyz(xyz):\n    lines = xyz.splitlines()[2:]\n    return [line.split()[0] for line in lines], np.array([[float(value) for value in line.split()[1:]] for line in lines])\n\n\ndef run_molecule(item, out_dir, gpu, optimize_fn=optimize):\n    \"\"\"Run one molecule, saving every completed state so a later run can resume.\"\"\"\n    out_dir, path = Path(out_dir), Path(out_dir) / f\"{item['inchikey']}.json\"\n    data = json.loads(path.read_text()) if path.exists() else {**item, \"states\": {}, \"adducts\": {}}\n    symbols, coords = embed(item[\"smiles\"])\n    for name, charge, spin in ((\"Q\", 0, 0), (\"Q_radical_anion\", -1, 1), (\"Q_dianion\", -2, 0)):\n        if not _done(data[\"states\"].get(name)):\n            data[\"states\"][name] = optimize_fn(symbols, coords, charge, spin, gpu=gpu)\n            save_json(path, data)\n    q2 = data[\"states\"].get(\"Q_dianion\")\n    if not _done(q2):\n        return data\n    missing_sites = [site for site in carbonyl_sites(item[\"smiles\"]) if not _done(data[\"adducts\"].get(str(site)))]\n    if not missing_sites:\n        return data\n    q2_symbols, q2_coords = _xyz(q2[\"xyz\"])\n    for site in missing_sites:\n        key = str(site)\n        adduct_symbols, adduct_coords = co2_adduct(q2_symbols, q2_coords, site)\n        data[\"adducts\"][key] = {**optimize_fn(adduct_symbols, adduct_coords, -2, 0, gpu=gpu), \"o_index\": site}\n        save_json(path, data)\n    return data\n\n\ndef run_common(out_dir, gpu, optimize_fn=optimize):\n    out_dir, path = Path(out_dir), Path(out_dir) / \"_common.json\"\n    data = json.loads(path.read_text()) if path.exists() else {\"states\": {}}\n    for name, smiles, charge, spin in ((\"CO2\", \"O=C=O\", 0, 0), (\"O2\", \"O=O\", 0, 2), (\"O2_radical_anion\", \"O=O\", -1, 1)):\n        if not _done(data[\"states\"].get(name)):\n            symbols, coords = embed(smiles)\n            data[\"states\"][name] = optimize_fn(symbols, coords, charge, spin, gpu=gpu)\n            save_json(path, data)\n    return data\n\n\ndef run_selected(items, out_dir, gpu, common_path=OUT / \"_common.json\", optimize_fn=optimize):\n    \"\"\"Run selected candidates after copying already-computed common states.\"\"\"\n    out_dir = Path(out_dir)\n    out_dir.mkdir(parents=True, exist_ok=True)\n    if Path(common_path).resolve() != (out_dir / \"_common.json\").resolve():\n        shutil.copyfile(common_path, out_dir / \"_common.json\")\n    for item in items:\n        run_molecule(item, out_dir, gpu, optimize_fn=optimize_fn)\n\n\ndef _distance(adduct):\n    symbols, coords = _xyz(adduct[\"xyz\"])\n    return float(np.linalg.norm(coords[adduct[\"o_index\"]] - coords[len(symbols) - 3]))\n\n\ndef summarize(out_dir):\n    \"\"\"Read completed JSON files and fit the attached-adduct exchange line only.\"\"\"\n    out_dir = Path(out_dir)\n    common = json.loads((out_dir / \"_common.json\").read_text())[\"states\"]\n    co2, o2, o2_minus = (common[name][\"energy\"] for name in (\"CO2\", \"O2\", \"O2_radical_anion\"))\n    prior_path = out_dir / \"summary.json\"\n    prior = json.loads(prior_path.read_text()) if prior_path.exists() else {}\n    rows, fit_rows = [], []\n    for path in sorted(out_dir.glob(\"*.json\")):\n        if path.name.startswith(\"_\") or path.name == \"summary.json\":\n            continue\n        data = json.loads(path.read_text())\n        if \"states\" not in data:  # other JSON in the folder (e.g. the loop's response.json) is not a molecule\n            continue\n        states = data[\"states\"]\n        if not all(_done(states.get(name)) for name in (\"Q_radical_anion\", \"Q_dianion\")):\n            continue\n        e2 = (states[\"Q_dianion\"][\"energy\"] - states[\"Q_radical_anion\"][\"energy\"]) * 27.2114\n        candidates = [(adduct[\"energy\"], _distance(adduct)) for adduct in data[\"adducts\"].values() if _done(adduct)]\n        if not candidates:\n            continue\n        adduct_energy, distance = min(candidates)\n        # ponytail: electronic energies only; add vibrational/free-energy corrections for absolute comparisons.\n        bind = (adduct_energy - states[\"Q_dianion\"][\"energy\"] - co2) * 627.5\n        mol = Chem.MolFromSmiles(data[\"smiles\"])\n        rings = mol.GetRingInfo().NumRings() if mol else 0\n        family = data.get(\"class\") or f\"original_{rings}_rings\"\n        row = {\"family\": family, \"inchikey\": data[\"inchikey\"], \"E2_eV\": e2, \"E2_reported_V\": -e2, \"dE_bind_kcal\": bind,\n               \"co2_distance\": distance, \"co2_detached\": distance > 2.0,\n               \"E_O2_eV\": (o2_minus - o2) * 27.2114}\n        rows.append(row)\n        if not row[\"co2_detached\"]:\n            fit_rows.append(row)\n    summary = {\"molecules\": rows, \"excluded_detached\": len(rows) - len(fit_rows), \"line_measurable\": len(fit_rows) >= 10}\n    if prior.get(\"line_v1\") or prior.get(\"line\"):\n        summary[\"line_v1\"] = prior.get(\"line_v1\") or prior[\"line\"]\n    if summary[\"line_measurable\"]:\n        x, y = np.array([row[\"E2_eV\"] for row in fit_rows]), np.array([row[\"dE_bind_kcal\"] for row in fit_rows])\n        a, b = np.linalg.lstsq(np.column_stack([x, np.ones(len(x))]), y, rcond=None)[0]\n        summary[\"line\"] = {\"a\": float(a), \"b\": float(b), \"sigma\": float(np.std(y - (a * x + b))), \"n\": len(x)}\n        families = {}\n        for row in fit_rows:\n            residual = row[\"dE_bind_kcal\"] - (a * row[\"E2_eV\"] + b)\n            families.setdefault(row[\"family\"], []).append(float(residual))\n        summary[\"family_residuals\"] = {name: {\"n\": len(values), \"mean\": float(np.mean(values)), \"max_abs\": max(map(abs, values))} for name, values in families.items()}\n    save_json(out_dir / \"summary.json\", summary)\n    with open(out_dir / \"summary.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as handle:\n        writer = csv.DictWriter(handle, fieldnames=[\"family\", \"inchikey\", \"E2_eV\", \"E2_reported_V\", \"dE_bind_kcal\", \"co2_distance\", \"co2_detached\", \"E_O2_eV\"])\n        writer.writeheader()\n        writer.writerows(rows)\n    return summary\n\n\ndef _worker(gpu, items, out_dir):\n    os.environ[\"CUDA_VISIBLE_DEVICES\"] = str(gpu)\n    for item in items:\n        run_molecule(item, out_dir, True)\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--gpus\", default=\"0,1\")\n    parser.add_argument(\"--only\", type=int)\n    parser.add_argument(\"--summary\", action=\"store_true\")\n    parser.add_argument(\"--input\", type=Path)\n    parser.add_argument(\"--out\", type=Path)\n    args = parser.parse_args()\n    if args.summary:\n        print(summarize(args.out or OUT))\n        return\n    out = args.out or OUT\n    items, gpus = (input_set(args.input) if args.input else reference_set(INPUT)), args.gpus.split(\",\")\n    if args.only is not None:\n        items = items[:args.only]\n    out.mkdir(parents=True, exist_ok=True)\n    os.environ[\"CUDA_VISIBLE_DEVICES\"] = gpus[0]\n    if args.input:\n        run_selected([], out, True)  # only copies the reference-set common states; molecules go to the GPU pool below\n    else:\n        run_common(out, True)\n    # spawn, not fork: the parent already initialised CUDA in run_common, and a forked child cannot re-init it\n    with mp.get_context(\"spawn\").Pool(len(gpus)) as pool:\n        pool.starmap(_worker, [(gpu, items[index::len(gpus)], out) for index, gpu in enumerate(gpus)])\n    print(summarize(out))\n\n\nif __name__ == \"__main__\":\n    main()\n", "highlevel.py": "\"\"\"Composite high-level calculations, restartable per molecule/state/level.\"\"\"\nimport argparse\nimport csv\nimport json\nimport numpy as np\nimport multiprocessing as mp\nimport os\nimport shutil\nimport traceback\nfrom pathlib import Path\n\nfrom rdkit import Chem\n\nROOT = Path(__file__).resolve().parents[1]\nOUT = ROOT / 'dft/runs/highlevel'\nREF = ROOT / 'dft/runs/ref_set'\nFC = Path(__file__).with_name('highlevel_fc.json')\nPUBCHEM_CACHE = ROOT / 'onto/data/pubchem_cache.json'\nEV = 27.2114\nSMILES = ['O=C1C(F)=C(Cl)C(=O)C(Cl)=C1',\n          'O=C1C(F)=C(Cl)C(=O)C(Cl)=C1F',\n          'O=C1C(F)=C(Cl)C(=O)C=C1Cl',\n          'O=C1C(Cl)=C(Cl)C(=O)C(Cl)=C1Cl']\n# name -> (SMILES with chloranil last, output folder, exchange line the set was selected with)\nSETS = {'v1': (SMILES, OUT, 'line_v1'),\n        'v2': (['O=C1C=CC(=O)c2nc3cnc(F)cc3nc21', 'O=C1C=CC(=O)c2nc3nccnc3nc21', SMILES[-1]],\n               ROOT / 'dft/runs/highlevel_v2', 'line')}\nSTATES = {'Q': (0, 0), 'Q_radical_anion': (-1, 1), 'Q_dianion': (-2, 0),\n          'adduct': (-2, 0), 'CO2': (0, 0)}\n\n\ndef read(path):\n    return json.loads(Path(path).read_text())\n\n\ndef save(path, data):\n    path = Path(path)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    tmp = path.with_suffix('.tmp')\n    tmp.write_text(json.dumps(data, indent=2) + '\\n')\n    tmp.replace(path)\n\n\ndef start_geometry(low, state):\n    if state == 'adduct':\n        good = [v for v in low['adducts'].values() if v.get('converged') and v.get('geom_converged') and not v.get('error') and v.get('xyz') and v.get('energy') is not None]\n        result = min(good, key=lambda v: v['energy'])\n        site = result['o_index']\n    else:\n        result = low['states'][state]\n        if not result.get('converged') or not result.get('geom_converged') or result.get('error'):\n            raise ValueError(f'low-level {state} did not converge')\n        site = None\n    return '\\n'.join(result['xyz'].splitlines()[2:]).strip(), site\n\n\ndef inputs(smiles_list=SMILES):\n    items = []\n    for smiles in smiles_list:\n        key = Chem.MolToInchiKey(Chem.MolFromSmiles(smiles))\n        matches = sorted((ROOT / 'onto/phase_8_design/runs').glob(f'loop-*/round_*/{key}.json'))\n        path = REF / f'{key}.json' if smiles == smiles_list[-1] else matches[-1]\n        items.append({'id': key, 'smiles': smiles, 'source': str(path), 'low': read(path)})\n    return items\n\n\ndef jobs(out=OUT, smiles_list=SMILES):\n    from pyscf import gto\n    items = inputs(smiles_list)\n
